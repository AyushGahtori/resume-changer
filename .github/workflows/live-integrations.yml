name: Live integration checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-integrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-live:
    name: Gemini live API
    runs-on: ubuntu-latest
    # A free-tier request can take up to two minutes, and a run walks the
    # provider's model chain when one model has no daily quota left. The
    # budget covers a full chain walk for the three live tests.
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # The free tier caps requests per model per day, so the live check
      # leaves the model unset and lets the provider walk its model chain.
      # Pinning a single model here would collapse that chain and spend the
      # whole daily budget of one model on a single run.
      #
      # The free tier is also slow and its latency varies a lot, so the
      # per-request budget is generous. A request that is cut short cannot
      # be retried for the same quota cost.
      GEMINI_REQUEST_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the Gemini secret is configured
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not configured. Add it as a repository secret so the live Gemini check can run."
            exit 1
          fi
          echo "The Gemini live check is using the repository secret."

      - name: Verify live Gemini analysis, selection, and drafting
        run: npm run test:ai-live

  pdf-toolchain:
    name: Real Tectonic and PDF toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdfinfo -v

      - name: Install pinned Tectonic release
        run: |
          set -euo pipefail
          version=0.14.1
          archive="tectonic-${version}-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/tectonic-${version}"
          curl --fail --location --retry 3 \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$install_dir"
          test -x "$install_dir/tectonic"
          echo "$install_dir" >> "$GITHUB_PATH"
          echo "TECTONIC_BINARY=$install_dir/tectonic" >> "$GITHUB_ENV"
          "$install_dir/tectonic" --version

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-0.14.1-${{ hashFiles('src/lib/latex/jake-template.ts') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify the PDF toolchain is present
        run: |
          set -euo pipefail
          tectonic --version
          pdfinfo -v

      - name: Verify real PDF compilation and page enforcement
        run: npm run test:pdf-live
